<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <meta name="application-name" content="Vendly" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Vendly" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#F7F0D8" />
  <meta name="msapplication-TileColor" content="#F7F0D8" />
  <meta name="msapplication-tap-highlight" content="no" />

  <meta name="description" content="Vendly helps Nigerian merchants manage sales, inventory and payments in one simple business app." />

  <link rel="icon" type="image/svg+xml" href="icons/vendly-favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/vendly-favicon.png" />
  <link rel="apple-touch-icon" href="icons/vendly-apple-touch-icon.png" />

  <title>Vendly — Simple sales for growing businesses</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    html, body {
      overscroll-behavior-y: none;
      background: #F7F0D8;
    }

    #splash {
      position: fixed;
      inset: 0;
      background: #F7F0D8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.2s ease-out;
    }

    #splash.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #splash img {
      width: 76px;
      height: 76px;
    }

    #splash .splash-name {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      color: #173F2B;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .splash-loader {
      width: 28px;
      height: 28px;
      position: relative;
    }

    .splash-loader::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: #173F2B;
      border-right-color: rgba(23, 63, 43, 0.25);
      animation: spin 1s cubic-bezier(0.5, 0.2, 0.5, 0.8) infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <div id="splash" aria-label="Loading Vendly">
    <img src="assets/vendly-mark.svg" alt="" onerror="this.style.visibility='hidden'" />
    <div class="splash-name">Vendly</div>
    <div class="splash-loader"></div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
